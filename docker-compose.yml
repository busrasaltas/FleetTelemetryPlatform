services:
  fleet-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - fleet-sql
      - fleet-rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=fleet-sql;Database=FleetTelemetryDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
      - RabbitMq__Host=fleet-rabbitmq

  fleet-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd5
    ports:
      - "1434:1433"

  fleet-rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP port for application connections 
      - "15672:15672"  # Management UI for monitoring queues